[project]
name = "sqlite-memory-mcp"
version = "0.1.0"
description = "SQLite-backed MCP memory server with FTS5 search. Drop-in replacement for @modelcontextprotocol/server-memory."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "db"]
